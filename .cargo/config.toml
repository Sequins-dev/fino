[env]
# New IsolateGroups require pointer compression without V8's shared cage.
# rusty_v8's distributed pointer-compressed archive uses a shared cage, so
# this configuration must be built from source.
V8_FROM_SOURCE = { value = "1", force = true }
# The sandbox is deliberately disabled: one sandbox per isolate group would
# require group-local ArrayBuffer allocators, preventing Fino's existing
# SharedArrayBuffer backing stores from crossing realm boundaries. Temporal was
# not exposed on V8 13.9, so keep it disabled while retaining the full Intl API.
GN_ARGS = { value = "is_debug=false v8_enable_pointer_compression=true v8_enable_pointer_compression_shared_cage=false v8_enable_sandbox=false v8_enable_temporal_support=false enable_rust=false enable_rust_cxx=false use_glib=false", force = true }
# The compiler wrapper exposes Chromium Clang's builtin headers to bindgen and
# redirects rusty_v8's isolate-allocation symbol to Fino's IsolateGroup shim.
SCCACHE = { value = "scripts/v8-compiler-wrapper.sh", relative = true, force = true }
NINJA = { value = "scripts/v8-ninja-wrapper.sh", relative = true, force = true }
# The Chromium Clang download contains builtin headers but no libclang shared
# library. The wrapper exposes those headers at this stable, crate-relative
# path for rusty_v8's bindgen step.
BINDGEN_EXTRA_CLANG_ARGS = "-isystemfino-clang-include"
