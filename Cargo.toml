[package]
name = "fino"
version = "0.1.0"
edition = "2024"

[dependencies]
v8 = { version = "=152.2.0", features = ["v8_enable_pointer_compression"] }
libc = "0.2"
libffi = "5.1.0"
libloading = "0.8"
smallvec = "1.13"
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9", features = ["serialize"] }
oxc_ast = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9", features = ["serialize"] }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_formatter = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_linter = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_sourcemap = "6.1.1"
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9", features = ["serialize"] }
oxc_transformer = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-executor = "1"
futures-channel = "0.3"
blocking = "1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[build-dependencies]
cc = "1"
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_sourcemap = "6.1.1"
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc.git", rev = "990763453c9bddc9f0337ec7ec15a63cc8b0a3d9" }
