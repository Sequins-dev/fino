name: DNSSEC Release Verification

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      dns_server:
        description: Recursive resolver used by the live DNSSEC checks
        required: false
        default: "1.1.1.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-dnssec:
    name: Live DNSSEC
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and V8 build
        id: build-cache
        uses: ./.github/actions/cache-cargo-deps
        with:
          profile: release

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libclang-dev \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build release binary
        run: cargo build --release

      - name: Check V8 artifact cache readiness
        id: v8-cache-ready
        if: ${{ !cancelled() && steps.build-cache.outputs.v8-cache-hit != 'true' }}
        run: |
          if [[ -s target/release/gn_out/obj/librusty_v8.a \
            && -s target/release/gn_out/src_binding.rs ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save V8 build artifact cache
        if: ${{ !cancelled() && steps.v8-cache-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            target/release/gn_out/obj/librusty_v8.a
            target/release/gn_out/src_binding.rs
          key: ${{ steps.build-cache.outputs.v8-cache-key }}

      - name: Verify signed and bogus public domains
        env:
          FINO_DNS_LIVE: "1"
          FINO_DNS_SERVER: ${{ inputs.dns_server || '1.1.1.1' }}
        run: ./target/release/fino test tests/net/dns-live.test.ts
