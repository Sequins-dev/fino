name: Benchmarks

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux Optimized Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and V8 build
        id: build-cache
        uses: ./.github/actions/cache-cargo-deps
        with:
          profile: release

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libclang-dev \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      # "Optimized", not "release": this is cargo's release *profile*, because timing a
      # debug build would measure the wrong thing. Nothing here publishes anything. It
      # was once uploaded as an artifact named `fino-linux-release`, which read like
      # something worth preserving — thirty accumulated and filled the account's
      # artifact quota, blocking every upload in the repository.
      - name: Build the optimized binary
        run: cargo build --release

      - name: Check V8 artifact cache readiness
        id: v8-cache-ready
        if: ${{ !cancelled() && steps.build-cache.outputs.v8-cache-hit != 'true' }}
        run: |
          if [[ -s target/release/gn_out/obj/librusty_v8.a \
            && -s target/release/gn_out/src_binding.rs ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save V8 build artifact cache
        if: ${{ !cancelled() && steps.v8-cache-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            target/release/gn_out/obj/librusty_v8.a
            target/release/gn_out/src_binding.rs
          key: ${{ steps.build-cache.outputs.v8-cache-key }}

      - name: Save the optimized binary
        uses: actions/cache/save@v4
        with:
          path: target/release/fino
          key: fino-linux-optimized-${{ github.run_id }}-${{ github.run_attempt }}

  linux-benchmarks:
    name: Linux Benchmarks (benchmarks/${{ matrix.path }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        path:
          - "*.bench.ts"
          - context/**/*.bench.ts
          - database/**/*.bench.ts
          - file/**/*.bench.ts
          - format/**/*.bench.ts
          - internal/**/*.bench.ts
          - net/**/*.bench.ts
          - opentelemetry/**/*.bench.ts
          - parsing/**/*.bench.ts
          - process/**/*.bench.ts
          - realm/**/*.bench.ts
          - security/**/*.bench.ts
          - test/**/*.bench.ts
          - tty/**/*.bench.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Restore the optimized binary
        uses: actions/cache/restore@v4
        with:
          path: target/release/fino
          key: fino-linux-optimized-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fino-linux-optimized-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/release/fino

      - name: Run subsystem benchmarks
        run: FINO_REQUIRE_SQLITE=1 ./target/release/fino bench 'benchmarks/${{ matrix.path }}'
