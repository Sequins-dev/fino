name: Benchmarks

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux Release Build
    runs-on: blacksmith-2vcpu-ubuntu-2604
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build release binary
        run: cargo build --release

      - name: Upload Linux release build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-release
          path: target/release/fino
          if-no-files-found: error

      - name: Package Linux protocol dependencies
        run: |
          tar -C "$RUNNER_TEMP/fino-protocol-deps" -czf \
            "$RUNNER_TEMP/fino-linux-protocol-deps.tar.gz" lib

      - name: Upload Linux protocol dependencies
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-protocol-deps
          path: ${{ runner.temp }}/fino-linux-protocol-deps.tar.gz
          if-no-files-found: error

  linux-benchmarks:
    name: Linux Benchmarks (benchmarks/${{ matrix.path }})
    runs-on: blacksmith-2vcpu-ubuntu-2604
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        path:
          - "*.bench.ts"
          - context/**/*.bench.ts
          - database/**/*.bench.ts
          - file/**/*.bench.ts
          - format/**/*.bench.ts
          - internal/**/*.bench.ts
          - net/**/*.bench.ts
          - opentelemetry/**/*.bench.ts
          - parsing/**/*.bench.ts
          - process/**/*.bench.ts
          - realm/**/*.bench.ts
          - security/**/*.bench.ts
          - test/**/*.bench.ts
          - tty/**/*.bench.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Download Linux release build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-release
          path: target/release

      - name: Prepare binary
        run: chmod +x target/release/fino

      - name: Restore Linux protocol dependencies
        uses: ./.github/actions/restore-linux-protocol-deps
        with:
          prefix: ${{ github.workspace }}/.fino-protocol-deps

      - name: Run subsystem benchmarks
        run: FINO_REQUIRE_SQLITE=1 ./target/release/fino bench 'benchmarks/${{ matrix.path }}'
