name: Benchmarks

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Build release binary
        run: cargo build --release

      - name: Upload Linux release build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-release
          path: target/release/fino
          if-no-files-found: error

  linux-benchmarks:
    name: Linux Benchmarks (benchmarks/${{ matrix.path }})
    runs-on: ubuntu-latest
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        path:
          - "*.bench.ts"
          - context/**/*.bench.ts
          - database/**/*.bench.ts
          - file/**/*.bench.ts
          - format/**/*.bench.ts
          - internal/**/*.bench.ts
          - net/**/*.bench.ts
          - opentelemetry/**/*.bench.ts
          - parsing/**/*.bench.ts
          - process/**/*.bench.ts
          - realm/**/*.bench.ts
          - security/**/*.bench.ts
          - test/**/*.bench.ts
          - tty/**/*.bench.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Download Linux release build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-release
          path: target/release

      - name: Prepare binary
        run: chmod +x target/release/fino

      - name: Run subsystem benchmarks
        run: FINO_REQUIRE_SQLITE=1 ./target/release/fino bench 'benchmarks/${{ matrix.path }}'
