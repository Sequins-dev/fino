name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Install LLVM 21 for bindgen
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 libclang-21-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Run Rust lint
        run: cargo clippy

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install LLVM 21 for bindgen
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 libclang-21-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib" >> "$GITHUB_ENV"

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      # Handed to the jobs below through the cache rather than an artifact.
      # Nothing outside this run consumes it, and artifact storage is an
      # org-wide quota that a full one blocks with a hard upload failure.
      - name: Save Linux build
        uses: actions/cache/save@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}

  macos-build:
    name: macOS Build
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: |
          brew install gnutls libnghttp2 libnghttp3 libngtcp2 llvm openssl@3 sqlite
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Save macOS build
        uses: actions/cache/save@v4
        with:
          path: target/debug/fino
          key: fino-macos-debug-${{ github.run_id }}-${{ github.run_attempt }}

  linux-tests:
    name: Linux Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    env:
      FINO_REQUIRE_H2: "1"
      FINO_REQUIRE_H3: "1"
      FINO_REQUIRE_TLS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests

  release-readiness:
    name: Release Readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Verify public builtin benchmark inventory
        run: ./target/debug/fino test tests/internal/benchmark-coverage.test.ts

  macos-tests:
    name: macOS Tests
    runs-on: blacksmith-6vcpu-macos-15
    needs: macos-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 snappy sqlite

      - name: Restore macOS build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-macos-debug-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fino-macos-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests
