name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test Matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export matrix
        id: matrix
        run: |
          ruby <<'RUBY'
          require 'json'
          require 'yaml'

          matrix = YAML.load_file('.github/test-matrix.yml')
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts("include=#{JSON.generate(matrix.fetch('include'))}")
          end
          RUBY

  fmt:
    name: Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Run Rust lint
        run: cargo clippy

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug/fino
          if-no-files-found: error

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: brew install gnutls libngtcp2 openssl@3 sqlite

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug/fino
          if-no-files-found: error

  linux-tests:
    name: Linux Tests (${{ matrix.subsystem }})
    runs-on: ubuntu-latest
    needs:
      - linux-build
      - test-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-matrix.outputs.include) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test ${{ matrix.paths }}

  macos-tests:
    name: macOS Tests (${{ matrix.subsystem }})
    runs-on: macos-latest
    needs:
      - macos-build
      - test-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-matrix.outputs.include) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install gnutls libngtcp2 openssl@3 sqlite

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test ${{ matrix.paths }}
