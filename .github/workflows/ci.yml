name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Restore Linux protocol dependencies
        uses: ./.github/actions/restore-linux-protocol-deps
        with:
          prefix: ${{ github.workspace }}/.fino-protocol-deps

      - name: Run Rust lint
        run: cargo clippy

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug/fino
          if-no-files-found: error

      - name: Package Linux protocol dependencies
        run: |
          tar -C "$RUNNER_TEMP/fino-protocol-deps" -czf \
            "$RUNNER_TEMP/fino-linux-protocol-deps.tar.gz" lib

      - name: Upload Linux protocol dependencies
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-protocol-deps
          path: ${{ runner.temp }}/fino-linux-protocol-deps.tar.gz
          if-no-files-found: error

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 sqlite

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug/fino
          if-no-files-found: error

  linux-tests:
    name: Linux Tests (tests/${{ matrix.path }})
    runs-on: ubuntu-latest
    needs: linux-build
    env:
      FINO_REQUIRE_H2: "1"
      FINO_REQUIRE_H3: "1"
      FINO_REQUIRE_TLS: "1"
    strategy:
      fail-fast: false
      matrix:
        path: &test-paths
          - "*.test.ts"
          - ai
          - archive
          - async-runtime
          - cluster
          - commands
          - data
          - docs
          - file
          - format
          - integration
          - internal
          - jobs
          - messaging
          - net
          - process
          - realm
          - runtime
          - security
          - task
          - test
          - tty
          - util
          - workflow
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Restore Linux protocol dependencies
        uses: ./.github/actions/restore-linux-protocol-deps
        with:
          prefix: ${{ github.workspace }}/.fino-protocol-deps

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests/${{ matrix.path }}

  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Restore Linux protocol dependencies
        uses: ./.github/actions/restore-linux-protocol-deps
        with:
          prefix: ${{ github.workspace }}/.fino-protocol-deps

      - name: Verify public builtin benchmark inventory
        run: ./target/debug/fino test tests/internal/benchmark-coverage.test.ts

  macos-tests:
    name: macOS Tests (tests/${{ matrix.path }})
    runs-on: macos-latest
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        path: *test-paths
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 sqlite

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests/${{ matrix.path }}
