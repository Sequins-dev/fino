name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Run Rust lint
        run: cargo clippy

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      # Handed to the jobs below through the cache rather than an artifact.
      # Nothing outside this run consumes it, and artifact storage is an
      # org-wide quota that a full one blocks with a hard upload failure.
      - name: Save Linux build
        uses: actions/cache/save@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}

  # Built and tested in one job because the macOS runners cannot read the
  # Actions cache — a save succeeds, and the matching restore is refused with
  # ECONNREFUSED on GetCacheEntryDownloadURL. Artifacts are not an option
  # either, since their quota is org-wide and fails the upload outright. With
  # no way to hand a binary to a second job, the second job has to go. Linux
  # can still split, and does.
  macos-build:
    name: macOS Build & Tests
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 snappy sqlite

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests

  linux-tests:
    name: Linux Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    env:
      FINO_REQUIRE_H2: "1"
      FINO_REQUIRE_H3: "1"
      FINO_REQUIRE_TLS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests

  release-readiness:
    name: Release Readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Linux build
        uses: actions/cache/restore@v4
        with:
          path: target/debug/fino
          key: fino-linux-debug-${{ github.run_id }}-${{ github.run_attempt }}
          # A re-run of only the failed jobs bumps the attempt without
          # re-running the build, so fall back to any attempt in this run.
          restore-keys: fino-linux-debug-${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Verify public builtin benchmark inventory
        run: ./target/debug/fino test tests/internal/benchmark-coverage.test.ts
