name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Run Rust lint
        run: cargo clippy

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug/fino
          if-no-files-found: error

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: brew install gnutls libngtcp2 openssl@3 sqlite

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug/fino
          if-no-files-found: error

  linux-tests:
    name: Linux Tests (${{ matrix.subsystem }})
    runs-on: ubuntu-latest
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - subsystem: ai
            paths: tests/ai
          - subsystem: archive-ffi-process
            paths: tests/archive tests/async-runtime tests/ffi.test.ts tests/ffi-callback.test.ts tests/process tests/profiler.test.ts
          - subsystem: file-format
            paths: tests/file tests/file-random-access.test.ts tests/format tests/markdown.test.ts tests/scanner.test.ts
          - subsystem: internal-runtime
            paths: tests/internal tests/runtime tests/commands
          - subsystem: net-http
            paths: tests/net/http-app.test.ts tests/net/http-client-webtransport.test.ts tests/net/http-client.test.ts tests/net/http-pool.test.ts tests/net/http-trailers.test.ts tests/net/http.test.ts tests/net/http2.test.ts tests/net/https.test.ts tests/net/eventsource.test.ts tests/net/serve-websocket.test.ts tests/net/serve.test.ts tests/net/websocket.test.ts tests/net/webtransport-h3-framing.test.ts tests/net/webtransport.test.ts
          - subsystem: net-transport
            paths: tests/net/dns-live.test.ts tests/net/dns-provider-interface.test.ts tests/net/dns.test.ts tests/net/dnssec.test.ts tests/net/provider-interface.test.ts tests/net/quic-h3.test.ts tests/net/quic-hq.test.ts tests/net/quic-node-interop.test.ts tests/net/quic-raw-packets.test.ts tests/net/quic-sim-recovery.test.ts tests/net/quic-sim.test.ts tests/net/quic-streams.test.ts tests/net/quic.test.ts tests/net/simulated-provider.test.ts tests/net/socket-class.test.ts tests/net/socket.test.ts tests/net/tls.test.ts
          - subsystem: realm-cluster
            paths: tests/realm tests/cluster tests/messaging
          - subsystem: data-security
            paths: tests/jsonrpc.test.ts tests/log.test.ts tests/security tests/sqlite-virt.test.ts tests/sqlite.test.ts tests/task.test.ts tests/template.test.ts tests/validate.test.ts tests/workflow
          - subsystem: web-platform
            paths: tests/integration tests/opentelemetry-http.integration.test.ts tests/opentelemetry.test.ts
          - subsystem: test-tty-util
            paths: tests/compress.test.ts tests/config.test.ts tests/test tests/tty.test.ts tests/tty tests/ui.test.ts tests/util tests/uuid.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libgnutls28-dev \
            libngtcp2-crypto-gnutls-dev \
            libngtcp2-dev \
            libsqlite3-dev \
            libssl-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test ${{ matrix.paths }}

  macos-tests:
    name: macOS Tests (${{ matrix.subsystem }})
    runs-on: macos-latest
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - subsystem: ai
            paths: tests/ai
          - subsystem: archive-ffi-process
            paths: tests/archive tests/async-runtime tests/ffi.test.ts tests/ffi-callback.test.ts tests/process tests/profiler.test.ts
          - subsystem: file-format
            paths: tests/file tests/file-random-access.test.ts tests/format tests/markdown.test.ts tests/scanner.test.ts
          - subsystem: internal-runtime
            paths: tests/internal tests/runtime tests/commands
          - subsystem: net-http
            paths: tests/net/http-app.test.ts tests/net/http-client-webtransport.test.ts tests/net/http-client.test.ts tests/net/http-pool.test.ts tests/net/http-trailers.test.ts tests/net/http.test.ts tests/net/http2.test.ts tests/net/https.test.ts tests/net/eventsource.test.ts tests/net/serve-websocket.test.ts tests/net/serve.test.ts tests/net/websocket.test.ts tests/net/webtransport-h3-framing.test.ts tests/net/webtransport.test.ts
          - subsystem: net-transport
            paths: tests/net/dns-live.test.ts tests/net/dns-provider-interface.test.ts tests/net/dns.test.ts tests/net/dnssec.test.ts tests/net/provider-interface.test.ts tests/net/quic-h3.test.ts tests/net/quic-hq.test.ts tests/net/quic-node-interop.test.ts tests/net/quic-raw-packets.test.ts tests/net/quic-sim-recovery.test.ts tests/net/quic-sim.test.ts tests/net/quic-streams.test.ts tests/net/quic.test.ts tests/net/simulated-provider.test.ts tests/net/socket-class.test.ts tests/net/socket.test.ts tests/net/tls.test.ts
          - subsystem: realm-cluster
            paths: tests/realm tests/cluster tests/messaging
          - subsystem: data-security
            paths: tests/jsonrpc.test.ts tests/log.test.ts tests/security tests/sqlite-virt.test.ts tests/sqlite.test.ts tests/task.test.ts tests/template.test.ts tests/validate.test.ts tests/workflow
          - subsystem: web-platform
            paths: tests/integration tests/opentelemetry-http.integration.test.ts tests/opentelemetry.test.ts
          - subsystem: test-tty-util
            paths: tests/compress.test.ts tests/config.test.ts tests/test tests/tty.test.ts tests/tty tests/ui.test.ts tests/util tests/uuid.test.ts
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install gnutls libngtcp2 openssl@3 sqlite

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run subsystem tests
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test ${{ matrix.paths }}
