name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust Format Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --check

  lint:
    name: Lint Checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3

      - name: Run Rust lint
        run: cargo clippy

      - name: Download Linux build
        uses: ./.github/actions/download-artifact
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run JS lint
        run: ./target/debug/fino lint js tests benchmarks demos

  linux-build:
    name: Linux Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libsqlite3-dev \
            make \
            perl \
            pkg-config \
            python3 \
            xz-utils

      - name: Install current protocol dependencies
        uses: ./.github/actions/install-linux-protocol-deps
        with:
          prefix: ${{ runner.temp }}/fino-protocol-deps

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fino-linux-debug
          path: target/debug/fino
          if-no-files-found: error
          # Only the test jobs in this same run consume it. Re-running a job
          # rebuilds and re-uploads, so nothing needs it after the run ends.
          retention-days: 3

  macos-build:
    name: macOS Build
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: ./.github/actions/cache-cargo-deps

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 sqlite

      - name: Build
        run: cargo build

      - name: Run Rust tests
        run: cargo test --quiet

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: fino-macos-debug
          path: target/debug/fino
          if-no-files-found: error
          retention-days: 3

  linux-tests:
    name: Linux Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    env:
      FINO_REQUIRE_H2: "1"
      FINO_REQUIRE_H3: "1"
      FINO_REQUIRE_TLS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Download Linux build
        uses: ./.github/actions/download-artifact
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests

  release-readiness:
    name: Release Readiness
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: linux-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Linux build
        uses: ./.github/actions/download-artifact
        with:
          name: fino-linux-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Verify public builtin benchmark inventory
        run: ./target/debug/fino test tests/internal/benchmark-coverage.test.ts

  macos-tests:
    name: macOS Tests
    runs-on: blacksmith-6vcpu-macos-15
    needs: macos-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install gnutls libnghttp2 libnghttp3 libngtcp2 openssl@3 snappy sqlite

      - name: Download macOS build
        uses: ./.github/actions/download-artifact
        with:
          name: fino-macos-debug
          path: target/debug

      - name: Prepare binary
        run: chmod +x target/debug/fino

      - name: Run full test suite
        run: FINO_REQUIRE_SQLITE=1 ./target/debug/fino test tests
