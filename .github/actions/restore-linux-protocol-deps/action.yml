name: Restore Linux protocol dependencies
description: Download the Linux TLS, HTTP/2, HTTP/3, and QUIC runtime libraries

inputs:
  prefix:
    description: Destination prefix for the native libraries
    required: true

runs:
  using: composite
  steps:
    - name: Download native protocol libraries
      uses: actions/download-artifact@v4
      with:
        name: fino-linux-protocol-deps
        path: ${{ inputs.prefix }}-artifact

    - name: Extract native protocol libraries
      shell: bash
      run: |
        mkdir -p '${{ inputs.prefix }}'
        tar -xzf '${{ inputs.prefix }}-artifact/fino-linux-protocol-deps.tar.gz' \
          -C '${{ inputs.prefix }}'
        echo 'LD_LIBRARY_PATH=${{ inputs.prefix }}/lib' >> "$GITHUB_ENV"
