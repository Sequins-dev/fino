name: Cache Cargo dependencies
description: Cache Cargo registry and Git dependency downloads without storing build outputs

runs:
  using: composite
  steps:
    - name: Restore Cargo dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-deps-${{ runner.os }}-${{ runner.arch }}-
