name: Cache Cargo and V8 build inputs
description: Cache Cargo downloads and the completed Fino-built V8 artifact

inputs:
  profile:
    description: Cargo target profile directory whose V8 outputs should be cached
    required: false
    default: debug
  variant:
    description: Native ABI or toolchain variant for compiled cache artifacts
    required: false
    default: native

outputs:
  v8-cache-hit:
    description: Whether the exact V8 artifact cache key was restored
    value: ${{ steps.v8-cache.outputs.cache-hit }}
  v8-cache-key:
    description: Primary key to use when saving the V8 build artifact
    value: ${{ steps.v8-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Restore Cargo dependency cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-deps-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore V8 build artifact cache
      id: v8-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          target/debug/gn_out/obj/librusty_v8.a
          target/debug/gn_out/src_binding.rs
          target/release/gn_out/obj/librusty_v8.a
          target/release/gn_out/src_binding.rs
          target/debug/build/gn_out/obj/librusty_v8.a
          target/debug/build/gn_out/src_binding.rs
          target/release/build/gn_out/obj/librusty_v8.a
          target/release/build/gn_out/src_binding.rs
        key: rusty-v8-artifact-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'scripts/v8-compiler-wrapper.sh', 'scripts/v8-ninja-wrapper.sh') }}

    # Let rusty_v8 place the archive in its own link directory. OUT_DIR depth
    # differs across Cargo versions; SKIP_DOWNLOAD bypasses this handoff.
    - name: Use restored V8 build artifact
      shell: bash
      run: |
        v8_dir="$GITHUB_WORKSPACE/target/${{ inputs.profile }}/gn_out"
        cached_v8_dir=''
        for candidate in \
          "$GITHUB_WORKSPACE/target/${{ inputs.profile }}/build/gn_out" \
          "$GITHUB_WORKSPACE/target/debug/build/gn_out" \
          "$GITHUB_WORKSPACE/target/release/build/gn_out" \
          "$v8_dir" \
          "$GITHUB_WORKSPACE/target/debug/gn_out" \
          "$GITHUB_WORKSPACE/target/release/gn_out"; do
          if [[ -s "$candidate/obj/librusty_v8.a" \
            && -s "$candidate/src_binding.rs" ]]; then
            cached_v8_dir="$candidate"
            break
          fi
        done
        if [[ -z "$cached_v8_dir" ]]; then
          exit 0
        fi
        {
          echo 'V8_FROM_SOURCE=0'
          echo "RUSTY_V8_ARCHIVE=$cached_v8_dir/obj/librusty_v8.a"
          echo "RUSTY_V8_SRC_BINDING_PATH=$cached_v8_dir/src_binding.rs"
        } >> "$GITHUB_ENV"
